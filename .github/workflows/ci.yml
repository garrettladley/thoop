name: CI
permissions: read-all
env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  SQLC_VERSION: "1.30.0"
  TEMPL_VERSION: "v0.3.865"
on:
  push:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: extractions/setup-just@v3

      - name: install dependencies
        run: just install

      - name: go fix
        run: just go-fix-verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --path-mode=abs --config=".golangci.yml" --timeout=5m

  sqlc-vet:
    name: sqlc vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: extractions/setup-just@v3

      - name: install dependencies
        run: just install

      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: Run sqlc vet
        run: just sqlc-vet

  sqlc-diff:
    name: sqlc diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: extractions/setup-just@v3

      - name: install dependencies
        run: just install

      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: Run sqlc diff
        run: just sqlc-diff

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: extractions/setup-just@v3

      - name: install dependencies
        run: just install

      - name: Test
        run: just test-ci

      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}

  templ-diff:
    name: templ diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: extractions/setup-just@v3

      - name: Cache templ
        id: cache-templ
        uses: actions/cache@v4
        with:
          path: ~/go/bin/templ
          key: templ-${{ env.TEMPL_VERSION }}

      - name: Install templ
        if: steps.cache-templ.outputs.cache-hit != 'true'
        run: just templ-install

      - name: Run templ generate
        run: just templ-verify
