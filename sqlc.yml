version: "2"
sql:
  # SQLite (TUI client)
  - engine: "sqlite"
    queries: "sqlc/queries/sqlite"
    schema:
      - "internal/migrations/sqlite/sql/*.sql"
    gen:
      go:
        package: "litesqlc"
        out: "internal/sqlite/sqlc"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true

  # PostgreSQL (Server)
  - engine: "postgresql"
    queries: "sqlc/queries/postgres"
    schema:
      - "internal/migrations/postgres/sql/*.sql"
    gen:
      go:
        package: "pgsqlc"
        out: "internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
